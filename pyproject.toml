[project]
name = "skill-action-sandbox"
version = "0.1.0"
description = "Declarative Safety Interceptor and AST Policy Guard for Agent Tools"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pandas>=2.0.0"
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"